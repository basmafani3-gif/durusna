<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>دروس عمر</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">
<style>
:root{color-scheme:light;--sky:#E1EEFF;--paper:#fff;--ink:#16255A;--soft:#56679C;--berry:#FF5D7A;--teal:#0E9F8E;--sun:#FFC93C}
*{box-sizing:border-box}
body{background:var(--sky);color:var(--ink);font-family:"Baloo Bhaijaan 2","Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;font-size:1.15rem;line-height:1.7;padding:20px 16px}
.wrap{max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:2rem;font-weight:800}p{margin:0;color:var(--soft);font-weight:700}
a.kid{display:flex;justify-content:space-between;align-items:center;gap:12px;text-decoration:none;color:#fff;border-radius:26px;padding:20px 22px;font-weight:800;font-size:1.7rem;box-shadow:0 8px 0 rgba(22,37,90,.25)}
a.kid small{font-size:1rem;font-weight:700;opacity:.95}
a.kid:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.saud{background:var(--teal)}.omar{background:var(--sun);color:var(--ink)!important}.sara{background:var(--berry)}
.card{background:var(--paper);border-radius:22px;padding:18px;box-shadow:0 6px 0 #B7CFF2}
.card p{color:var(--ink);font-weight:500}
.back{color:var(--ink);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="./">⬅ كل الصفحات</a>
<h1>دروس عمر</h1>
<p>الصف الثالث</p>
<div class="card"><p>دروس عمر لم تُضف بعد. ستظهر هنا بعد إضافة كتبه المدرسية.</p></div>
</div>
</body>
</html>
