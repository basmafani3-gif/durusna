<style>
/* Layout: one column lesson player. Step rail on top, then "from the book" card, "another way" card, then a quiz one question at a time. Single bright look by choice, sibling of Sara's page. */
:root{
  color-scheme:light;
  --sky:#E1EEFF; --paper:#FFFFFF; --ink:#16255A; --soft:#56679C; --edge:#B7CFF2;
  --teal:#0E9F8E; --sun:#FFC93C; --sunsoft:#FFF4CC; --ok:#17A673; --no:#E5484D; --nosoft:#FFE4E5;
  --font:"Baloo Bhaijaan 2","Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
  --r:22px;
}
*{box-sizing:border-box}
body{background:var(--sky);color:var(--ink);font-family:var(--font);font-size:1.15rem;line-height:1.7;padding-inline:16px;padding-block:16px}
.wrap{max-width:680px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-direction:column;gap:2px}
h1{margin:0;font-size:1.9rem;font-weight:800;line-height:1.2}
.sub{margin:0;color:var(--soft);font-weight:700;font-size:1.05rem}
.rail{display:flex;gap:6px}
.rail i{flex:1;height:10px;border-radius:99px;background:var(--paper)}
.rail i.done{background:var(--teal)}.rail i.now{background:var(--sun)}
h2{margin:0;font-size:1.6rem;font-weight:800;text-wrap:balance}
.pg{color:var(--soft);font-size:1rem;font-weight:700}
.card{background:var(--paper);border-radius:var(--r);padding:16px 18px;box-shadow:0 6px 0 var(--edge);display:flex;flex-direction:column;gap:10px;min-width:0}
.card.alt{background:var(--sunsoft);box-shadow:0 6px 0 #EBD58A}
.tag{align-self:flex-start;background:var(--ink);color:#fff;border-radius:99px;padding:0 14px;font-size:.95rem;font-weight:700}
.alt .tag{background:var(--sun);color:var(--ink)}
dl{margin:0;display:flex;flex-direction:column;gap:10px}
dt{font-weight:800;color:var(--teal);font-size:1.25rem}
dd{margin:0}
.ex{color:var(--no);font-weight:700}
p{margin:0}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.go{background:var(--teal);color:#fff;border-radius:99px;padding:10px 26px;font-size:1.3rem;font-weight:800;box-shadow:0 6px 0 #08695e;align-self:center}
.go:active,.opt:active{transform:translateY(3px)}
.go.plain{background:var(--paper);color:var(--ink);box-shadow:0 6px 0 var(--edge)}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.q{font-size:1.45rem;font-weight:800;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--paper);border-radius:16px;padding:10px 16px;font-size:1.25rem;font-weight:700;text-align:start;box-shadow:0 5px 0 var(--edge)}
.opt.ok{background:var(--ok);color:#fff;box-shadow:0 5px 0 #0d6e4b}
.opt.no{background:var(--nosoft);color:var(--no);box-shadow:0 5px 0 #f3b5b8}
.fb{font-weight:800;font-size:1.2rem;min-height:1.7em}
.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.big{font-size:3.4rem;font-weight:800;line-height:1.1;text-align:center;font-variant-numeric:tabular-nums}
.res{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.res li{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid var(--sky);padding-block:4px}
.res b{font-variant-numeric:tabular-nums}
.res .weak b{color:var(--no)}
.les{display:flex;justify-content:space-between;align-items:center;gap:12px}.les b{white-space:nowrap;color:var(--soft);font-variant-numeric:tabular-nums}.les b.full{color:var(--ok)}
.home{align-self:flex-start;background:var(--paper);border-radius:99px;padding:4px 16px;font-weight:700;font-size:1rem;box-shadow:0 4px 0 var(--edge);margin-top:6px}
.note{color:var(--soft);font-size:1rem;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.allkids{align-self:flex-start;color:inherit;font-weight:700;font-size:1rem;opacity:.7}
</style>

</head>

       ["الموضع الأول","إذا كانت الهمزة مفتوحة والحرف الذي قبلها مفتوح.","دَأَبَ"],
       ["الموضع الثاني","إذا كانت الهمزة ساكنة والحرف الذي قبلها مفتوح.","رَأْس"],
       ["الموضع الثالث","إذا كانت الهمزة مفتوحة والحرف الذي قبلها ساكن.","هيْأَة"]],
 alt:"في المواضع الثلاثة لا توجد كسرة ولا ضمة، بل فتحتان أو فتحة وسكون. والفتحة أقوى من السكون، فتفوز الفتحة ويناسبها الألف. مثال من جدول الكتاب: (رَأْسها) حركة الهمزة السكون وحركة ما قبلها الفتحة، فالحرف المناسب الألف.",
 q:[["تُكتب الهمزة المتوسطة على الألف إذا كانت أقوى الحركتين:",["الفتحة","الكسرة","الضمة"]],
    ["في «رَأْس» الهمزة ساكنة والحرف الذي قبلها:",["مفتوح","مكسور","مضموم"]],
    ["«دَأَبَ» مثال على:",["الهمزة مفتوحة وما قبلها مفتوح","الهمزة ساكنة وما قبلها مفتوح","الهمزة مفتوحة وما قبلها ساكن"]],
    ["«هيْأَة» مثال على:",["الهمزة مفتوحة وما قبلها ساكن","الهمزة مفتوحة وما قبلها مفتوح","الهمزة ساكنة وما قبلها مفتوح"]],
    ["الكلمة التي فيها همزة متوسطة على ألف في «يرأفُ الأبناءُ بوالديهم»:",["يرأف","الأبناء","بوالديهم"]],
    ["الكلمة التي فيها همزة متوسطة على ألف في «وضعَ الأبُ السلحفاةَ قربَ المدفأةِ»:",["المدفأة","السلحفاة","قرب"]]]}
];
const LES=[{t:"مراجعة المكتسبات السابقة",pg:"١٢ إلى ١٤",parts:L1},{t:"جمع المذكر السالم",pg:"٦٥",parts:L2},{t:"الأفعال الخمسة",pg:"٦٦ و٦٧",parts:L3},{t:"أنواع الجموع",pg:"٦٨",parts:L4},{t:"الهمزة المتوسطة على الألف",pg:"٦٩ إلى ٧١",parts:L5}];
let P=L1,li=0;
function best(i){try{return +localStorage.getItem("saud-l"+i)||0}catch(e){return 0}}
function menu(){
  $("rail").innerHTML="";$("home").hidden=true;
  $("stage").innerHTML=`<h2>اختر درسًا</h2>`+LES.map((l,i)=>{const tot=l.parts.reduce((s,p)=>s+p.q.length,0),b=best(i);
    return `<button class="opt les" data-i="${i}"><span>${n(i+1)}. ${l.t}<br><span class="pg">صفحة ${l.pg}</span></span><b class="${b===tot?"full":""}">${b?n(b)+" / "+n(tot):"جديد"}</b></button>`}).join("")+`<div class="row"><button class="go plain" id="rep">تقرير ولي الأمر</button></div>`;
  $("rep").onclick=()=>{report();goTop()};
  $("stage").querySelectorAll(".les").forEach(b=>b.onclick=()=>{li=+b.dataset.i;P=LES[li].parts;pi=0;got=P.map(()=>0);$("home").hidden=false;read();goTop()});
}
const AR="٠١٢٣٤٥٦٧٨٩",n=x=>String(x).replace(/\d/g,d=>AR[d]);
const $=id=>document.getElementById(id);
let pi=0,mode="read",qi=0,got=P.map(()=>0);

function rail(){$("rail").innerHTML=P.map((_,i)=>`<i class="${i<pi?"done":i===pi?"now":""}"></i>`).join("")}
function goTop(){try{window.scrollTo({top:0,behavior:"smooth"})}catch(e){}}
function read(){
  const p=P[pi];mode="read";rail();
  $("stage").innerHTML=`<div><h2>${n(pi+1)}. ${p.t}</h2><span class="pg">الكتاب، صفحة ${p.pg}</span></div>
  <div class="card"><span class="tag">من الكتاب</span><dl>${p.book.map(b=>`<div><dt>${b[0]}</dt><dd>${b[1]}${b[2]?` <span class="ex">${b[1]?"مثل: ":""}${b[2]}</span>`:""}</dd></div>`).join("")}</dl></div>
  <div class="card alt"><span class="tag">بطريقة أخرى</span><p>${p.alt}</p></div>
  <button class="go" id="start">اختبر نفسك</button>`;
  $("start").onclick=()=>{qi=0;got[pi]=0;quiz()};
}
function quiz(){
  const p=P[pi],q=p.q[qi];mode="quiz";
  const order=q[1].map((t,i)=>[t,i]).sort(()=>Math.random()-.5);
  $("stage").innerHTML=`<div><h2>${p.t}</h2><span class="pg">سؤال ${n(qi+1)} من ${n(p.q.length)}</span></div>
  <div class="card"><p class="q">${q[0]}</p><div class="opts">${order.map(o=>`<button class="opt" data-i="${o[1]}">${o[0]}</button>`).join("")}</div>
  <p class="fb" id="fb" aria-live="polite"></p></div><div class="row" id="nav"></div>`;
  let done=false;
  $("stage").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(done)return;done=true;
    const ok=b.dataset.i==="0",fb=$("fb");
    $("stage").querySelector('.opt[data-i="0"]').classList.add("ok");
    if(ok){got[pi]++;fb.className="fb ok";fb.textContent="إجابة صحيحة، أحسنت يا سعود!"}
    else{b.classList.add("no");fb.className="fb no";fb.textContent=`الصحيح: ${q[1][0]}. راجع صفحة ${p.pg} من الكتاب.`}
    const last=qi===p.q.length-1;
    $("nav").innerHTML=`<button class="go" id="next">${last?(pi===P.length-1?"النتيجة":"الجزء التالي"):"السؤال التالي"}</button>`;
    $("next").onclick=()=>{if(!last){qi++;quiz()}else{pi++;pi<P.length?read():result();goTop()}};
  });
}
function result(){
  rail();
  const total=P.reduce((s,p)=>s+p.q.length,0),sc=got.reduce((a,b)=>a+b,0);
  const bst=Math.max(sc,best(li));try{localStorage.setItem("saud-l"+li,bst)}catch(e){}
  const weak=P.filter((p,i)=>got[i]<p.q.length);
  $("stage").innerHTML=`<div class="card"><h2>نتيجة الدرس</h2><p class="big">${n(sc)} / ${n(total)}</p>
  <p>${sc===total?"ممتاز يا سعود! أتقنت الدرس كله.":weak.length<=2?"عمل جيد. بقيت أجزاء قليلة تحتاج مراجعة.":"تحتاج أن تراجع الدرس مرة أخرى، وستتقنه."}</p>
  <ul class="res">${P.map((p,i)=>`<li class="${got[i]<p.q.length?"weak":""}"><span>${p.t}</span><b>${n(got[i])} / ${n(p.q.length)}</b></li>`).join("")}</ul>
  <p class="pg">أفضل نتيجة لك على هذا الجهاز: ${n(bst)} / ${n(total)}</p><p class="pg" id="save"></p></div>
  <div class="row"><button class="go" id="again">أعد الدرس</button><button class="go plain" id="list">قائمة الدروس</button></div>`;
  $("list").onclick=()=>{menu();goTop()};
  const note=t=>{const e=$("save");if(e)e.textContent=t};
  const row={li,lesson:LES[li].t,score:sc,total,weak:weak.map(p=>p.t),at:Date.now()};
  if(db){note("جارٍ حفظ النتيجة في التقرير…");
    db.collection("results").add(row)
      .then(()=>note("تم حفظ النتيجة في تقرير ولي الأمر."),()=>note("تعذّر حفظ النتيجة في التقرير. النتيجة محفوظة على هذا الجهاز فقط."))}
  else{try{const a=local();a.unshift(row);localStorage.setItem("saud-log",JSON.stringify(a.slice(0,300)));note("تم حفظ النتيجة في التقرير على هذا الجهاز.")}catch(e){note("تعذّر حفظ النتيجة على هذا الجهاز.")}}
  $("again").onclick=()=>{pi=0;got=P.map(()=>0);read();goTop()};
}
let db=null;
try{window.claude&&window.claude.use&&window.claude.use("db").then(d=>{db=d},()=>{})}catch(e){}
function local(){try{return JSON.parse(localStorage.getItem("saud-log"))||[]}catch(e){return []}}
function report(){
  $("rail").innerHTML="";$("home").hidden=false;
  $("stage").innerHTML=`<h2>تقرير ولي الأمر</h2><div class="card"><p>جارٍ تحميل النتائج…</p></div>`;
  (db?db.collection("results").orderBy("at","desc").limit(300).get().then(s=>s.docs.map(d=>d.data())):Promise.resolve(local())).then(rows=>{
    const now=Date.now(),d0=new Date();d0.setHours(0,0,0,0);
    const today=rows.filter(r=>r.at>=d0.getTime()),week=rows.filter(r=>r.at>=now-7*864e5);
    const tm=t=>{try{return new Date(t).toLocaleTimeString("ar-SA",{hour:"2-digit",minute:"2-digit"})}catch(e){return ""}};
    const line=r=>`<li class="${r.score<r.total?"weak":""}"><span>${tm(r.at)} · ${r.lesson}${r.weak&&r.weak.length?`<br><span class="pg">يحتاج مراجعة: ${r.weak.join("، ")}</span>`:""}</span><b>${n(r.score)} / ${n(r.total)}</b></li>`;
    const per=LES.map((l,i)=>{const a=week.filter(r=>r.li===i);if(!a.length)return "";
      const b=Math.max(...a.map(r=>r.score)),tot=a[0].total;
      return `<li class="${b<tot?"weak":""}"><span>${l.t}<br><span class="pg">عدد المحاولات: ${n(a.length)} · آخر نتيجة: ${n(a[0].score)} / ${n(tot)}</span></span><b>${n(b)} / ${n(tot)}</b></li>`}).join("");
    const left=LES.filter((l,i)=>!rows.some(r=>r.li===i)).map(l=>l.t);
    $("stage").innerHTML=`<h2>تقرير ولي الأمر</h2>
    <div class="card"><span class="tag">اليوم</span>${today.length?`<ul class="res">${today.map(line).join("")}</ul>`:`<p>لم يُكمل سعود أي درس اليوم.</p>`}</div>
    <div class="card"><span class="tag">آخر ٧ أيام · أفضل نتيجة لكل درس</span>${per?`<ul class="res">${per}</ul>`:`<p>لا توجد نتائج في آخر ٧ أيام.</p>`}</div>
    ${db?"":`<p class="pg">هذا التقرير يعرض النتائج المحفوظة على هذا الجهاز.</p>`}
    <div class="card alt"><span class="tag">دروس لم يبدأها</span><p>${left.length?left.join("، "):"أكمل كل الدروس المتاحة."}</p></div>`;
  },()=>{$("stage").innerHTML=`<h2>تقرير ولي الأمر</h2><div class="card"><p>تعذّر تحميل النتائج. حاول مرة أخرى بعد قليل.</p></div>`});
}
$("home").onclick=()=>{menu();goTop()};
menu();
</script>

</body>
</html>
